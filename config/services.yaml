# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(REDIS_URL): 'redis://default:%env(ENV_redis_password)%@%env(ENV_redis_host)%:%env(ENV_redis_port)%'
    env(ENV_redis_host): "redis"
    env(ENV_redis_port): "6379"
    env(ENV_redis_password): "redis_password"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Admin\UserAdmin:
      tags:
        - { name: sonata.admin, model_class: App\Entity\User, manager_type: orm, group: Main, label: UserAdmin }
      calls:
        - ['setSecurityRoleHierarchy', [ '%security.role_hierarchy.roles%']]
        - ['setTranslationDomain', ['UserAdmin']]

    App\Admin\ClientAdmin:
        tags:
            - { name: sonata.admin, model_class: App\Entity\Client, manager_type: orm, group: Main, label: ClientAdmin }
        calls:
            - ['setSecurityRoleHierarchy', [ '%security.role_hierarchy.roles%']]
            - ['setTranslationDomain', ['ClientAdmin']]

    #App\Admin\DataTypeAdmin:
    #  tags:
    #    - { name: sonata.admin, model_class: App\Entity\DataType, manager_type: orm, group: Main, label: DataType }
    #  calls:
    #    - ['setTranslationDomain', ['DataTypeAdmin']]

    App\Admin\ConfigAdmin:
      tags:
        - { name: sonata.admin, model_class: App\Entity\Config, manager_type: orm, group: Internal, label: ConfigAdmin }
      calls:
        - ['setTranslationDomain', ['ConfigAdmin']]

    App\Security\UserAuthentificatorAuthenticator:
        autowire: true

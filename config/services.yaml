# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(resolve:REDIS_URL)%'
            # По умолчанию подключение ждёт 30 с, а чтение не ограничено:
            # /health отдал бы 503 позже, чем истечёт проба готовности.
            - { timeout: 2, read_timeout: 2 }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Admin\UserAdmin:
      tags:
        - { name: sonata.admin, model_class: App\Entity\User, manager_type: orm, group: Main, label: UserAdmin }
      calls:
        - ['setTranslationDomain', ['UserAdmin']]

    App\Admin\ClientAdmin:
        tags:
            - { name: sonata.admin, model_class: App\Entity\Client, manager_type: orm, group: Main, label: ClientAdmin }
        calls:
            - ['setTranslationDomain', ['ClientAdmin']]

    App\Admin\ConfigAdmin:
      tags:
        - { name: sonata.admin, model_class: App\Entity\Config, manager_type: orm, group: Internal, label: ConfigAdmin }
      calls:
        - ['setTranslationDomain', ['ConfigAdmin']]

    OpenTelemetry\API\Metrics\MeterProviderInterface:
        factory: ['\OpenTelemetry\API\Globals', 'meterProvider']

    OpenTelemetry\API\Metrics\MeterInterface:
        factory: ['@OpenTelemetry\API\Metrics\MeterProviderInterface', 'getMeter']
        arguments: ['%env(OTEL_SERVICE_NAME)%']

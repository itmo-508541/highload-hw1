# Read the documentation: https://symfony.com/doc/master/bundles/FOSRestBundle/index.html
fos_rest:
    #    allowed_methods_listener:  true
    #    routing_loader: true
    # Use Symfony Serializer even if JMSSerializerBundle is installed (see SerializerConfigurationPass).
    service:
        serializer: fos_rest.serializer.symfony
    serializer:
        serialize_null: true
        groups: ['api']
    param_fetcher_listener:
        enabled: true
    body_listener:
        enabled: true
    format_listener:
        enabled: true
        rules:
            - { path: ^/api, prefer_extension: false, fallback_format: json, priorities: [ json ] }
            # JSON-ручки вне /api: новая такая ручка дописывается сюда. Формат решается
            # до роутера, поэтому `defaults: { _format: json }` на роуте не поможет.
            - { path: ^/(items|health)(/|$), prefer_extension: false, fallback_format: json, priorities: [ json ] }
            - { path: ^/, priorities: [ 'html', '*/*'], fallback_format: html, prefer_extension: true }
    versioning:
        enabled: true
        default_version: v1.0
        resolvers:
            query: true         # Query parameter: /users?version=v1
            custom_header: true # X-Accept-Version header
            media_type:         # Accept header
                enabled: true
                regex: '/(v|version)=(?P<version>[0-9\.]+)/'
        guessing_order:
            - query
            - media_type
            - custom_header
    exception:
        enabled: true
        serializer_error_renderer: true
        #codes:
        #    App\Exception\MyException: 403
        messages:
            Symfony\Component\HttpKernel\Exception\HttpException: true
    view:
        view_response_listener: 'force'


#exception_listener: false
#serializer_error_renderer: true
#serialize_exceptions: false
#map_exception_codes: true

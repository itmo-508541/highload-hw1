jms_serializer:
    visitors:
        xml_serialization:
            format_output: '%kernel.debug%'
    metadata:
        auto_detection: false
        cache: file
        warmup:
            paths:
                included:
                    - "%kernel.project_dir%/src/Entity"
                    - "%kernel.project_dir%/src/Model"
        directories:
            app-entity:
                namespace_prefix: "App\\Entity"
                path: "%kernel.project_dir%/src/Entity"
            app-model:
                namespace_prefix: "App\\Model"
                path: "%kernel.project_dir%/src/Model"

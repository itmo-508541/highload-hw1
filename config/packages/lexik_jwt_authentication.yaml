# See https://github.com/lexik/LexikJWTAuthenticationBundle/blob/3.x/Resources/doc/1-configuration-reference.rst
#
# openssl genrsa -out config/jwt/private.prod.pem -aes256 4096
# openssl rsa -pubout -in config/jwt/private.prod.pem -out config/jwt/public.prod.pem
lexik_jwt_authentication:
    secret_key: '%kernel.project_dir%/config/jwt/private.pem'
    public_key: '%kernel.project_dir%/config/jwt/public.pem'
    pass_phrase: '%env(ENV_jwt_passphrase)%'
    token_ttl: 86400

    token_extractors:
        # look for a token as Authorization Header
        authorization_header:
            enabled: true
            prefix:  ~
            name:    X-Auth-Token

name: "${DOCKER_COMPOSE_NAME}"

x-security: &default-security
    read_only: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    nginx:
        image: "${CI_NGINX_IMAGE_WITH_TAG}"
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        networks:
            - nginx
        ports:
          - 80
        depends_on:
            mysql:
                condition: service_started
            redis:
                condition: service_healthy
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid
        restart: always
        labels:
            docker-gen.host: ${SERVER_NAME}

    php: &php-service
        image: "${CI_APP_IMAGE_WITH_TAG}"
        command: "php-fpm8.4"
        networks:
            - nginx
            - mysql
            - redis
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid
        env_file:
            - .env
            - .env.local
        environment:
            APP_ENV: prod
            APP_DEBUG: ${ENV_debug}
            TRUSTED_PROXIES: "0.0.0.0/0"
        restart: always

    spare:
        << : *php-service

    redis:
        image: redis:8-trixie
        user: "999:999"
        command: ["redis-server", "--requirepass", "${ENV_redis_password}"]
        networks:
            - redis
        environment:
            REDISCLI_AUTH: "${ENV_redis_password}"
        volumes:
            - redis-data:/data
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=16M
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --no-auth-warning PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 3s

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        networks:
            - mysql
        expose:
            - 3306
        environment:
            MYSQL_ROOT_PASSWORD: "${ENV_database_root_password}"
        volumes:
          - database:/var/lib/mysql
        restart: always

volumes:
    database:
    redis-data:

networks:
    nginx:
    mysql:
    redis:

version: '3.4'

services:
    nginx:
        image: "${CI_NGINX_IMAGE_WITH_TAG}"
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        ports:
          - 80
        depends_on:
            - mysql
        volumes:
          - "storage:/srv/storage:ro"
        restart: always
        labels:
            docker-gen.host: ${SERVER_NAME}

    php: &php-service
        image: "${CI_APP_IMAGE_WITH_TAG}"
        command: "php-fpm8.0"
        env_file:
            - .env
            - .compose-env
        environment:
            APP_ENV: prod
            TRUSTED_PROXIES: "0.0.0.0/0"
        volumes:
          - "storage:/srv/storage:rw"
        restart: always

    spare:
        << : *php-service

    mysql:
        image: mysql:8.0.26
        command: mysqld --sql_mode=""
        expose:
          - 3306
        environment:
            MYSQL_ROOT_PASSWORD: "${ENV_database_root_password}"
            MYSQL_DATABASE: "${ENV_database_name}"
            MYSQL_USER: "${ENV_database_user}"
            MYSQL_PASSWORD: "${ENV_database_password}"
        volumes:
          - database:/var/lib/mysql
        restart: always

volumes:
    database:
    storage:

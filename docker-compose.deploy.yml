name: "${DOCKER_COMPOSE_NAME}"

services:
    nginx:
        image: "${CI_NGINX_IMAGE_WITH_TAG}"
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        ports:
          - 80
        depends_on:
            - mysql
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:rw,noexec,nosuid
        #volumes:
        #  - "storage:/srv/storage:ro"
        restart: always
        labels:
            docker-gen.host: ${SERVER_NAME}

    php: &php-service
        image: "${CI_APP_IMAGE_WITH_TAG}"
        command: "php-fpm8.4"
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:rw,noexec,nosuid
        env_file:
            - .env
            - .env.local
        environment:
            APP_ENV: prod
            APP_DEBUG: ${ENV_debug}
            TRUSTED_PROXIES: "0.0.0.0/0"
        #volumes:
        #  - "storage:/srv/storage:rw"
        restart: always

    spare:
        << : *php-service

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        expose:
          - 3306
        environment:
            MYSQL_ROOT_PASSWORD: "${ENV_database_root_password}"
        volumes:
          - database:/var/lib/mysql
        restart: always

volumes:
    database:
    #storage:

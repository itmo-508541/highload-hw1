name: "${DOCKER_COMPOSE_NAME}"

x-security: &default-security
    read_only: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    nginx:
        image: "${CI_NGINX_IMAGE_WITH_TAG}"
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        networks:
            - nginx
        ports:
          - 80
        depends_on:
            mysql:
                condition: service_started
            redis:
                condition: service_healthy
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid
        restart: always
        labels:
            docker-gen.host: ${SERVER_NAME}

    php: &php-service
        image: "${CI_APP_IMAGE_WITH_TAG}"
        command: "php-fpm8.4"
        networks:
            - nginx
            - mysql
            - redis
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid
        configs:
            - source: env.php
              target: /srv/.env.local.php
        secrets:
            - .env.local.php
            - jwt_public.pem
            - jwt_private.pem
        restart: always

    spare:
        << : *php-service

    redis:
        image: redis:8-trixie
        user: "999:999"
        command: ["redis-server", "/run/secrets/redis.conf"]
        networks:
            - redis
        volumes:
            - redis-data:/data
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=16M
        restart: always
        configs:
            - source: redis_healthcheck
              target: /redis-healthcheck.sh
        healthcheck:
            test: ["CMD-SHELL", "sh /redis-healthcheck.sh"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 3s
        secrets:
          - redis.conf

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        networks:
            - mysql
        expose:
            - 3306
        environment:
            MYSQL_ROOT_PASSWORD: "/run/secrets/mysql_root_password"
        volumes:
          - database:/var/lib/mysql
        restart: always
        secrets:
          - mysql_root_password

volumes:
    database:
    redis-data:

networks:
    nginx:
    mysql:
    redis:

configs:
    env.php:
        file: env.php
    redis_healthcheck:
        file: redis-healthcheck.sh

secrets:
    .env.local.php:
        file: secrets/.env.local.php
    jwt_public.pem:
        file: secrets/jwt_public.pem
    jwt_private.pem:
        file: secrets/jwt_private.pem
    mysql_root_password:
        file: secrets/mysql_root_password
    redis.conf:
        file: secrets/redis.conf

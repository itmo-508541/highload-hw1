[global]
pid = /tmp/php8.4-fpm.pid
daemonize = no
error_log = /dev/stderr
log_level = warning

[www]
access.log = /dev/stdout
catch_workers_output = yes
clear_env = no

listen = [::]:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

pm = dynamic
pm.max_children = 64
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 256

user = www-data
group = www-data

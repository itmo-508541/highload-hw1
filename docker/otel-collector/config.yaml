receivers:
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318
processors:
    batch:
    deltatocumulative:
        max_stale: 30m

exporters:
    prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
            enabled: true
    prometheusremotewrite:
        endpoint: http://prometheus:9090/api/v1/write
        resource_to_telemetry_conversion:
            enabled: true
        tls:
            insecure: true

service:
    pipelines:
        metrics:
            receivers: [otlp]
            processors: [deltatocumulative, batch]
            exporters: [prometheus]

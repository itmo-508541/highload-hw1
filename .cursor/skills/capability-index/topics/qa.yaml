topic: qa
spec: openspec/specs/qa/spec.md
summary: Раздельные каталоги для слоёв тестов и specs, контуры Unit/Behat/E2E

files:
  - path: phpunit.dist.xml
    role: Конфигурация PHPUnit (suite Unit + suite E2E)
  - path: behat.yml.dist
    role: Конфигурация Behat (suite default + suite e2e)
  - path: tests/E2E/HomepageTest.php
    role: Дымовой E2E-тест главной страницы (PHPUnit)
  - path: tests/E2E/E2eSessionStorageTest.php
    role: E2E-проверка записи сессии в Redis
  - path: features/e2e/homepage.feature
    role: Дымовой E2E-сценарий главной (Behat)
  - path: .gitlab-ci.yml
    role: CI-pipeline с разделением Unit/Behat и E2E job'ов

entry_points:
  - type: command
    path: make test
    handler: "PHPUnit suite Unit (tests/ без E2E)"
  - type: command
    path: make test-e2e
    handler: "PHPUnit suite E2E (tests/E2E/)"
  - type: command
    path: make behat
    handler: "Behat suite default (features/ без e2e)"
  - type: command
    path: make behat-e2e
    handler: "Behat suite e2e (features/e2e/)"

tests:
  - path: tests/E2E/HomepageTest.php
    role: "E2E: главная открывается в браузере"
  - path: tests/E2E/E2eSessionStorageTest.php
    role: "E2E: сессия пишется в Redis, не mock_file"
  - path: features/e2e/homepage.feature
    role: "E2E Behat: главная открывается в браузере"

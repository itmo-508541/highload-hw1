schema: spec-driven

# Project context — injected into ALL artifact prompts.
context: |
  Проект: Symfony-backend.
  Стек: PHP 8.4, Symfony 7.4, MySQL 8, Redis 8, Docker Compose, Composer, Make, Phing
  Бандлы: FOSRest, LexikJWT, NelmioApiDoc, SonataAdmin.

  Тестирование:
  - PHPUnit 13 — unit/integration тесты (tests/).
  - Behat 3 — functional/acceptance тесты (features/) и E2E-тесты (Panther, Mink).

  Инструменты качества: PHP CS Fixer, PHPStan, Rector.

  Скиллы:
  - phpunit-tests — unit/integration тесты (.cursor/skills/phpunit-tests/SKILL.yaml).
  - behat-tests — functional/acceptance/e2e тесты (.cursor/skills/behat-tests/SKILL.yaml).
  - brownfield-map — описание существующего поведения legacy-кода (.cursor/skills/brownfield-map/SKILL.yaml).

  Язык: русский.

# Per-artifact rules — injected only for the matching artifact.
rules:
  proposal:
    - "Укажи тип: изменение brownfield-поведения, новая capability или чистый refactor/tooling."

#  specs:
#    - "Каталоги openspec/specs/ и features/ не сливать и не переносить друг в друга."
#
  design:
    - "Для каждого изменения зафиксируй затрагиваемые границы модулей и существенные технические риски."
    - "Если изменение требует архитектурного решения, укажи необходимость создания или обновления ADR."
    - "Для описания изменений в brownfield-поведении воспользуйся скиллом `brownfield-map` и создай в design раздел «Brownfield-поведение» по его Required Output."

  tasks:
    - "Перед задачами по изменению кода добавь обязательные задачи на characterization/regression тесты, фиксирующие наблюдаемое brownfield-поведение затрагиваемых путей."
    - "Для каждого затронутого Scenario из specs добавь задачу на создание или изменение автоматизированного теста."
    - "При подготовке задач по созданию тестов выбирай между PHPUnit и Behat по уровню поведения: PHPUnit — unit/integration, Behat — functional/acceptance/e2e."

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - "Для создания тестов используй скиллы `phpunit-tests` и `behat-tests`."
      - "PHP/QA-команды — запуск через Makefile (make test, make behat и т.д.), не на хосте, со всеми permissions."

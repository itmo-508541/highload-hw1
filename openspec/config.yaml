schema: spec-driven

# Project context — injected into ALL artifact prompts.
# Операционные детали стека — в docs/; процесс/ADR — в openspec/process.md.
context: |
  Проект: Symfony-шаблон backend (PHP 8.4, Symfony 7.4; MySQL 8, Redis 8,
  Docker Compose, Composer, Phing). Бандлы: FOSRest, LexikJWT, NelmioApiDoc, SonataAdmin.
  PHP и QA только в Docker-сервисе `php`; фасад — Makefile (`make test` / `make behat` / `make qa`).
  Язык артефактов (proposal/design/tasks/specs) — русский; пути, ID, CLI — как в инструментах.
  Слои не смешивать: поведение = openspec/specs/**; unit = tests/; приёмка = features/;
  E2E — отдельный будущий слой. Main specs сейчас: platform, qa.
  Процесс (core), ADR, CLI/CI — openspec/process.md. Операционные runbook'и — docs/ (см. docs/AGENTS.md).
  В specs — только поведение и invariants, не runbook'и.

# Per-artifact rules — injected only for the matching artifact.
rules:
  proposal:
    - "Пиши на русском; имя change — kebab-case латиницей."
    - "Явно укажи Why, What Changes, Non-goals и Impact (код, API, ops, тесты)."
    - "Не требуй и не ссылайся на CHANGELOG как на артефакт процесса."
  specs:
    - "Пиши требования и сценарии на русском."
    - "Сценарии в формате Given/When/Then (или эквивалентные блоки с теми же ролями)."
    - "Описывай наблюдаемое поведение, не детали реализации."
    - "Каждый Scenario затрагиваемого capability должен подразумевать покрытие тестом: PHPUnit (tests/) и/или Behat (features/) — по смыслу Scenario; не обязательно оба слоя."
    - "При затрагивании тестов укажи ожидаемый слой: PHPUnit (tests/) и/или Behat (features/). Запрещено предлагать сливать или переносить каталоги openspec/specs и features."
  design:
    - "Пиши на русском; опирайся на существующие паттерны репозитория (Docker-only PHP, Makefile)."
    - "Зафиксируй риски, границы модулей и необходимость ADR, если решение архитектурное; иначе явно отметь, что durable ADR не требуется."
    - "Укажи, какие проверки (make test / make behat / make qa) подтверждают design."
  tasks:
    - "Пиши на русском; задачи — конкретные, проверяемые чеклист-пункты."
    - "Для каждого затронутого Scenario из specs добавь или укажи тест (путь к *Test.php и/или .feature); ссылай Scenario → тест без формальной матрицы ID."
    - "Включай шаги на тесты по затронутому scope; change без UI/приёмки может ограничиться PHPUnit."
    - "PHP/QA-команды формулируй через Makefile / Docker-сервис php, не запуск PHPUnit/Behat на хосте."
    - "При архитектурном решении добавь задачу на ADR (/adr → adr/NNNN-<slug>.md); если durable ADR не нужен — не изобретай."
    - "Не предлагай переносить .feature в openspec/ или spec.md в features/."

# Per-operation guidance — advisory for apply/archive workflows.
operations:
  apply:
    guidance:
      - "Реализуй строго по tasks.md активного change; отмечай выполненное в чеклисте."
      - "После реализации (код и/или тесты) запускай в Docker релевантные проверки по scope: make test и/или make behat; при широком изменении — make qa."
      - "Сверяй покрытие с Scenario из specs change: новый или изменённый Scenario без теста — пробел, закрой до archive."
      - "Не добавляй записи в CHANGELOG как часть apply."
  archive:
    guidance:
      - "Перед archive убедись, что релевантные проверки зелёные (make test / make behat по scope) и delta specs готовы к merge."
      - "Дай краткое summary исхода (что вошло в main specs, что осталось follow-up)."
      - "Не веди и не требуй CHANGELOG при закрытии change."

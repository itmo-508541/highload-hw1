schema: spec-driven

# Project context — injected into ALL artifact prompts.
context: |
  Проект: приложение «Инструменты автоматизации в Grafana» — домашняя работа
  HW1 (`HW1.md`): микросервис с REST-ручками над записями (`/items`) и ручкой
  готовности (`/health`), на котором строятся метрики золотых сигналов,
  генератор дашборда Grafana и нагрузочный скрипт.
  Стек: PHP 8.4, Symfony 7.4, MySQL 8, Redis 8, Docker Compose, Composer, Make, Phing.
  Бандлы: FOSRest, LexikJWT, NelmioApiDoc, SonataAdmin, Doctrine ORM 3.6.

  Тестирование:
  - PHPUnit 13 — unit/integration (`tests/`), карта suite'ов в `tests/CLAUDE.md`.
  - Behat 3 — приёмочные сценарии (`features/`), реестр доменов в `features/CLAUDE.md`.

  Инструменты качества: PHP CS Fixer, PHPStan, Rector. Гейт — `make qa`.

  Скиллы проекта вызываются инструментом `Skill` по имени:
  - testing-strategy — выбор инструмента, места и типа теста;
  - phpunit-tests, behat-tests — написание и прогон тестов выбранным инструментом;
  - brownfield-map — описание существующего поведения legacy-кода по доказательствам;
  - tests-pattern-catalog — пополнение каталога механик тестов по указанию человека;
  - skill-retro — оценка скилла по произведённому им артефакту;
  - vendor-class-lookup — чтение определения класса по FQCN.

  Язык: русский.

# Per-artifact rules — injected only for the matching artifact.
rules:
  specs:
    - "Текст спеки — русский, нормативные глаголы — SHALL, SHALL NOT, MUST, MUST NOT — латиницей, ключевые слова сценария — WHEN / THEN / AND — латиницей."

  proposal:
    - "Укажи тип: изменение brownfield-поведения, bugfix, новая capability или чистый refactor/tooling."
    - "Для bugfix-изменений, если в ходе explore было проведено содержательное расследование причины ошибки (анализ БД, SQL-запросы, логи, проверка гипотез и т.п.), создай investigation.md в change directory и ссылайся на него в proposal."

  design:
    - "Если изменение требует архитектурного решения, укажи необходимость создания или обновления ADR в `docs/adr/`."
    - "Если change затрагивает существующее поведение, до раздела «Стратегия тестирования» создай раздел «Brownfield-поведение» скиллом `brownfield-map`. Структуру раздела задаёт `CONTRACT.md` этого скилла — в тексте design её не дублируй."
    - "В design добавь раздел «Стратегия тестирования»: для каждого сценария спеки определи инструмент, место и тип теста скиллом `testing-strategy`; правила выбора в тексте design не дублируй. Оформи результат отдельной таблицей на каждый задействованный инструмент — колонки задаёт скилл. Сценарии, покрытые не своей строкой, сценарии, не покрываемые вовсе, и инструмент, сознательно не задействованный в change, вынеси прозой после таблиц с коротким обоснованием — состав списков задаёт скилл. Разделы «Решения» и «Предусловия», если скилл их выдал, оставь в design как есть — на них ссылаются задачи."
    - "Состояние строки и подсчёт по состояниям — часть формата раздела, который задаёт скилл; определения состояний в тексте design не дублируй."
    - "Если change меняет поведение, наблюдаемое в проде, после раздела «Стратегия тестирования» добавь раздел «Наблюдаемость»: сигналы, доказывающие достижение цели change'а, и сигналы здоровья, которые change сдвигать не должен. По каждому сигналу — источник, точный запрос и порог pass/fail. Источник — существующий артефакт прода: журнал, состояние БД, сгенерированный файл, отправленное письмо. Сигнал, для которого источника в проекте нет, назови и пометь как отсутствующий."
    - "Если change добавляет характеризационные проверки, добавь раздел «Чувствительность проверок» — следом за «Наблюдаемостью», а при её отсутствии на её месте: по каждой строке раздела «Стратегия тестирования» в состояниях «новая» и «переписывается» укажи правку в коде, от которой проверка этой строки обязана покраснеть, и источник, где это видно. Строка группы, покрытой одной параметризованной проверкой, получает собственную строку чувствительности: правка обязана ронять именно её набор данных, а не проверку целиком. Вечнозелёная проверка не принимается. Отдельно перечисли существующие проверки, которые change обязан оставить зелёными и не удалять. Разделы независимы и могут присутствовать оба: «Наблюдаемость» отвечает за новое и изменённое поведение, «Чувствительность проверок» — за характеризационные проверки. Если не применим ни один — напиши прозой почему."

  tasks:
    - "Задачи на создание тестов формируй **только** по таблицам раздела «Стратегия тестирования». Раздел «Brownfield-поведение» — контекст для их выполнения, а не источник задач: маршрутизатор мог опровергнуть утверждение карты, и тогда верна таблица."
    - "Строки, у которых в «Обосновании» названа одна и та же общая проверка, дают **одну** задачу на параметризованный тест, а не задачу на каждую строку."
    - "Каждое предусловие из раздела «Предусловия» — отдельная задача, и она идёт **перед** задачами по тем строкам таблицы, которые это предусловие разблокирует: строки перечислены в самом предусловии."
    - "Строки в состоянии «уже покрыта» задачами не становятся."
    - "По строкам в состоянии `БЛОКИРОВАНО` задач не формируй: снятие условия лежит вне объёма этого change."
    - "По строкам, помеченным `ТРЕБУЕТ РЕШЕНИЯ`, задач не формируй: соответствующий вопрос из `Open Questions` должен быть закрыт раньше."
    - "Риски `R<n>` из «Brownfield-поведения», не попавшие ни в одну таблицу «Стратегии тестирования», задачами этого change не становятся — при необходимости они заводятся отдельными тикетами."
    - "Сигналы, помеченные в разделе «Наблюдаемость» как отсутствующие, становятся отдельными задачами этого change'а."
    - "По каждой строке раздела «Чувствительность проверок» добавь задачу: внести указанную правку, убедиться, что проверка краснеет, вернуть код — после задачи на создание этой проверки."
    - "Последними задачами добавь запуск `make qa` и проведение `code-review`, задачи должны выполняться вручную **пользователем**."

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - "Перед созданием и запуском теста прочитай скилл `phpunit-tests` или `behat-tests` по инструменту из «Стратегии тестирования»."
      - "Перед написанием теста прочитай раздел «Решения» из design: там зафиксированы найденный шов наблюдения, его ограничения и следствия для оформления теста."
      - "PHP/QA-команды — только через Makefile и только в контейнере (`make test`, `make behat` и т.д.), не на хосте."

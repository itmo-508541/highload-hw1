x-security: &default-security
    read_only: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    nginx:
        build:
            context: "."
            dockerfile: Dockerfile-nginx
            target: dev
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        networks:
            - nginx
        ports:
            - "80:80"
        depends_on:
            php:
                condition: service_started
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=128M
        volumes:
            - static:/srv/public/bundles

    php: &php
        build:
            context: "."
            dockerfile: Dockerfile
            target: prod
        networks:
            - nginx
            - mysql
            - redis
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_started
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid
        environment:
            HOME: /tmp
        secrets:
            - jwt_public.pem
            - jwt_private.pem
        volumes:
            - static:/srv/public/bundles
            - ./.env:/srv/.env:ro
            - ./.env.prod:/srv/.env.prod:ro

    init:
        <<: *php
        command: ["phing"]
        depends_on:
            - php

    redis:
        image: redis:8-trixie
        user: "999:999"
        command: ["redis-server", "--requirepass", "root"]
        networks:
            - redis
        environment:
            REDISCLI_AUTH: "root"
        volumes:
            - redis-data:/data
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=16M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --no-auth-warning PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 3s

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        ports:
            - "3306:3306"
        networks:
            - mysql
        environment:
            MYSQL_ROOT_PASSWORD: "root"
        volumes:
            - database:/var/lib/mysql

volumes:
    database:
    static:
    redis-data:

networks:
    nginx:
    mysql:
    redis:

secrets:
    jwt_public.pem:
        file: config/jwt/public.pem
    jwt_private.pem:
        file: config/jwt/private.pem

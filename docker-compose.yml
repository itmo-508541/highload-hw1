services:
    nginx:
        build:
            context: "."
            dockerfile: Dockerfile-nginx
            target: dev
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        ports:
            - "80:80"
        depends_on:
            - php
            - mysql
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=128M
        volumes:
            - ./public:/srv/public
            #- ./storage/upload:/srv/storage/upload

    php:
        build:
            context: "."
            dockerfile: Dockerfile
            target: dev
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:rw,noexec,nosuid
        environment:
            APP_ENV: dev
            APP_DEBUG: 1
            DOCTRINE_PROXY_AUTO_GENERATE: 1
        volumes:
            - .:/srv

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - 8080:80
        depends_on:
            - mysql
        environment:
            PMA_ARBITRARY: "1"
            PMA_HOST: "mysql"
            PMA_USER: "root"
            PMA_PASSWORD: "root"

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "root"
        volumes:
            - database:/var/lib/mysql

volumes:
    database:

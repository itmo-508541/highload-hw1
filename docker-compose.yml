x-security: &default-security
    read_only: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

x-php-env: &php-env
    HOME: /tmp

x-php: &php
    build:
        context: "."
        dockerfile: Dockerfile
        target: prod
    networks:
        - nginx
        - mysql
        - redis
        - observability
    depends_on:
        redis:
            condition: service_healthy
        mysql:
            condition: service_started
        init:
            condition: service_completed_successfully
    <<: *default-security
    tmpfs:
        - /tmp:rw,noexec,nosuid
    environment:
        <<: *php-env
    secrets:
        - jwt_public.pem
        - jwt_private.pem
    # Как на production: .env-файлов нет, шим подключает дамп env, собранный init
    volumes:
        - static:/srv/public/bundles
        - dotenv:/run/dotenv:ro
        - ./secrets/env-demo.php:/srv/.env.local.php:ro

services:
    nginx:
        build:
            context: "."
            dockerfile: Dockerfile-nginx
            target: dev
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        networks:
            - nginx
        ports:
            - "80:80"
        depends_on:
            php:
                condition: service_started
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=128M
        volumes:
            - static:/srv/public/bundles

    php:
        <<: *php
        environment:
            <<: *php-env
            POD_ID: 'pod-1'
            DATACENTER: 'dc-eu-west-2'

    spare:
        <<: *php
        environment:
            <<: *php-env
            POD_ID: 'pod-2'
            DATACENTER: 'dc-us-east-5'

    # При каждом старте пересобирает дамп env из .env-цепочки проекта, затем готовит БД и assets
    init:
        <<: *php
        command: ["sh", "-c", "php tools/env-dump.php /run/dotenv-src /run/dotenv/.env.local.php && exec phing"]
        environment:
            <<: *php-env
            OTEL_PHP_AUTOLOAD_ENABLED: false
        depends_on:
            mysql:
                condition: service_started
        volumes:
            - static:/srv/public/bundles
            - dotenv:/run/dotenv
            - ./secrets/env-demo.php:/srv/.env.local.php:ro
            - .:/run/dotenv-src:ro

    grafana:
        image: grafana/grafana:11.6.16-ubuntu
        ports:
            - "3000:3000"
        networks:
            - observability
        environment:
            GF_SECURITY_ADMIN_PASSWORD: "${ENV_grafana_admin_password:?}"
        volumes:
            - grafana-data:/var/lib/grafana
        configs:
            - source: grafana-datasource-prometheus.yml
              target: /etc/grafana/provisioning/datasources/prometheus.yml

    prometheus:
        image: prom/prometheus:v3.15.1
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
        ports:
            - "9090:9090"
        networks:
            - observability
        configs:
            - source: prometheus.yaml
              target: /etc/prometheus/prometheus.yml
        volumes:
            - prometheus-data:/prometheus

    otelcollector:
        image: otel/opentelemetry-collector-contrib:0.163.2
        ports:
            - "8889:8889"
        depends_on:
            - prometheus
        networks:
            - observability
        configs:
            - source: otelcollector.yaml
              target: /etc/otelcol-contrib/config.yaml

    redis:
        image: redis:8-trixie
        user: "999:999"
        command: ["redis-server", "--requirepass", "${ENV_redis_password:?}"]
        networks:
            - redis
        environment:
            REDISCLI_AUTH: "${ENV_redis_password:?}"
        volumes:
            - redis-data:/data
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=16M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --no-auth-warning PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 3s

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        ports:
            - "3306:3306"
        networks:
            - mysql
        environment:
            MYSQL_ROOT_PASSWORD: "${ENV_database_root_password:?}"
        volumes:
            - database:/var/lib/mysql

volumes:
    database:
    static:
    redis-data:
    prometheus-data:
    grafana-data:
    dotenv:

networks:
    nginx:
    mysql:
    redis:
    observability:

configs:
    otelcollector.yaml:
        file: docker/otel-collector/config.yaml
    prometheus.yaml:
        file: docker/prometheus/prometheus.yml
    grafana-datasource-prometheus.yml:
        file: docker/grafana/datasources/prometheus.yml

secrets:
    jwt_public.pem:
        file: config/jwt/public.pem
    jwt_private.pem:
        file: config/jwt/private.pem

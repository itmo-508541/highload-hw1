x-security: &default-security
    read_only: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    nginx:
        build:
            context: "."
            dockerfile: Dockerfile-nginx
            target: dev
        entrypoint: ["/docker-entrypoint.sh"]
        command: ["nginx", "-g", "daemon off;"]
        networks:
            - nginx
        ports:
            - "80:80"
        depends_on:
            php:
                condition: service_started
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=128M
        volumes:
            - ./public:/srv/public

    php:
        build:
            context: "."
            dockerfile: Dockerfile
            target: dev
        networks:
            - nginx
            - mysql
            - redis
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_started
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid
        environment:
            HOME: /tmp
            APP_ENV: dev
            APP_DEBUG: 1
            DOCTRINE_PROXY_AUTO_GENERATE: 1
        volumes:
            - .:/srv

    redis:
        image: redis:8-trixie
        user: "999:999"
        command: ["redis-server", "--requirepass", "${ENV_redis_password}"]
        networks:
            - redis
        environment:
            REDISCLI_AUTH: "${ENV_redis_password}"
        volumes:
            - redis-data:/data
        <<: *default-security
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=16M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --no-auth-warning PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 3s

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - 8080:80
        networks:
            - mysql
        depends_on:
            - mysql
        environment:
            PMA_ARBITRARY: "1"
            PMA_HOST: "mysql"
            PMA_USER: "root"
            PMA_PASSWORD: "root"

    mysql:
        image: mysql:8.0-debian
        command: mysqld --sql_mode=""
        ports:
            - "3306:3306"
        networks:
            - mysql
        environment:
            MYSQL_ROOT_PASSWORD: "root"
        volumes:
            - database:/var/lib/mysql

volumes:
    database:
    redis-data:

networks:
    nginx:
    mysql:
    redis:

image: docker:26

variables:
  CI_APP_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  CI_TEST_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/test:$CI_COMMIT_REF_NAME"
  CI_SOURCE_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/source:$CI_COMMIT_REF_NAME"
  CI_SOURCE_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/source:master"
  CI_NGINX_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_NAME"
  CI_NGINX_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/nginx:master"
  CI_GIT_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/git:$CI_COMMIT_REF_NAME"
  CI_GIT_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/git:master"

stages:
  - .pre
  - build
  - test
  - deploy
  - .post

.job-tags:
  tags:
    - executor-docker
    - docker-in-docker

.job-policy-branches:
  extends:
    - .job-tags
  only:
    - branches

.job-policy-mainline:
  extends:
    - .job-tags
  only: &mainline
    - master
    - production
  environment:
    name: $CI_COMMIT_REF_SLUG

.prepare-env:
  stage: .pre
  needs: []
  script:
    - touch .env.prod.local
    - |
      for var in $(env | grep '^ENV_'); do
        var_name=$(echo "$var" | cut -d'=' -f1);
        var_value=$(printenv "$var_name");
        var_value=$(printf '%s' "$var_value" | sed 's/\\/\\\\/g; s/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g');
        printf '%s="%s"\n' "$var_name" "$var_value" >> .env.prod.local;
      done
  artifacts:
    paths:
      - .env.prod.local

.build-docker-source-image:
  stage: build
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_SOURCE_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_SOURCE_IMAGE_CACHE
          --tag $CI_SOURCE_IMAGE_WITH_TAG
          --target source .
    - docker push $CI_SOURCE_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

.app-script:
  extends:
    - .job-policy-branches
  stage: test
  image: $CI_SOURCE_IMAGE_WITH_TAG
  cache: &composer-cache
    key: "composer-cache"
    paths:
      - .composer-cache/
    policy: pull
  variables:
    XDEBUG_MODE: coverage
    HOME: /srv
  before_script:
    - composer config -g cache-dir "$(pwd)/.composer-cache"
    - composer install --prefer-dist --no-scripts --no-interaction
    - mkdir --parent build

.deploy-script:
  image: $CI_GIT_IMAGE_WITH_TAG
  variables:
    GIT_STRATEGY: none

.deploy-script-ssh:
  extends:
    - .deploy-script
  before_script:
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"

prepare:env:
  extends:
    - .prepare-env
    - .job-policy-branches
  except:
    *mainline

prepare-mainline:env:
  extends:
    - .prepare-env
    - .job-policy-mainline
  variables:
    REQUIRED_VARS: >-
        SERVER_NAME
        DEPLOY_USER
        DEPLOY_HOST
        DEPLOY_DIRECTORY
        ENV_app_secret
        ENV_database_password
        ENV_database_root_password
        ENV_jwt_passphrase
        ENV_redis_password
    REQUIRED_FILES: >-
        JWT_PRIVATE_KEY
        JWT_PUBLIC_KEY
        SSH_PRIVATE_KEY
  before_script:
    - |
        set -eu
        for var_name in $REQUIRED_VARS; do
          echo "Checking CI variable $var_name";
          var_value=$(printenv "$var_name" || true);
          if [ -z "$var_value" ]; then
            echo "Missing or empty variable: $var_name (Settings -> CI/CD -> Variables, type Variable)" >&2;
            exit 1;
          fi;
        done;
        for var_name in $REQUIRED_FILES; do
          echo "Checking CI file variable $var_name";
          file_path=$(printenv "$var_name" || true);
          if [ -z "$file_path" ]; then
            echo "Missing or empty: $var_name (Settings -> CI/CD -> Variables, type File)" >&2;
            exit 1;
          fi;
          if [ ! -f "$file_path" ]; then
            echo "$var_name must be a File variable: value is not a path to a regular file (got non-file or inline secret?)." >&2;
            exit 1;
          fi;
          if [ ! -r "$file_path" ]; then
            echo "$var_name file path is not readable" >&2;
            exit 1;
          fi;
        done;

build-mainline:docker-git-image:
  extends:
    - .job-policy-mainline
  stage: build
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_GIT_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_GIT_IMAGE_CACHE
          --tag $CI_GIT_IMAGE_WITH_TAG
          ./docker/git
    - docker push $CI_GIT_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

build-mainline:docker-compose:
  extends:
    - .job-policy-mainline
  stage: build
  needs:
    - job: prepare-mainline:env
      artifacts: true
  script:
    - export DOCKER_COMPOSE_NAME="${SERVER_NAME//./_}"
    - mkdir --parent build
    - docker compose -f docker-compose.deploy.yml config > build/docker-compose.yml
    - sed -i 's/\/builds\/'"$CI_PROJECT_NAMESPACE"'\/'"$CI_PROJECT_NAME"'/\./g' build/docker-compose.yml
  artifacts:
    paths:
      - build/

build:docker-source-image:
  extends:
    - .job-policy-branches
    - .build-docker-source-image
  except:
    *mainline
  needs:
    - job: prepare:env
      artifacts: true

build-mainline:docker-source-image:
  extends:
    - .job-policy-mainline
    - .build-docker-source-image
  needs:
    - job: prepare-mainline:env
      artifacts: true

build-mainline:docker-app-image:
  extends:
    - .job-policy-mainline
  stage: build
  needs:
    - job: build-mainline:docker-source-image
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_SOURCE_IMAGE_WITH_TAG || true
    - docker build
          --cache-from $CI_SOURCE_IMAGE_CACHE
          --tag $CI_APP_IMAGE_WITH_TAG
          --build-arg source_image=$CI_SOURCE_IMAGE_WITH_TAG
          --target prod .
    - docker push $CI_APP_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

build-mainline:docker-nginx-image:
  extends:
    - .job-policy-mainline
  stage: build
  needs:
    - job: build-mainline:docker-source-image
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_NGINX_IMAGE_CACHE || true
    - docker pull $CI_SOURCE_IMAGE_WITH_TAG || true
    - docker build --build-arg app_image=$CI_SOURCE_IMAGE_WITH_TAG
          --cache-from $CI_NGINX_IMAGE_CACHE
          --tag $CI_NGINX_IMAGE_WITH_TAG
          --target prod
          --file Dockerfile-nginx .
    - docker push $CI_NGINX_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

prepare:composer-cache:
  extends:
    - .app-script
  cache:
    <<: *composer-cache
    policy: pull-push
  script:
    - echo Ok

qa:php-cs-fixer:
  extends:
    - .app-script
  needs:
    - job: prepare:composer-cache
  script:
    - vendor/bin/php-cs-fixer fix -v --dry-run --format=gitlab --diff --using-cache=no > build/php-cs-fixer.json
  artifacts:
    reports:
      codequality: build/php-cs-fixer.json

qa:phpstan:
  extends:
    - .app-script
  needs:
    - job: prepare:composer-cache
  script:
    - vendor/bin/phpstan analyse --error-format=gitlab > build/phpstan-codequality.json
  artifacts:
    reports:
      codequality: build/phpstan-codequality.json

qa:rector:
  extends:
    - .app-script
  needs:
    - job: prepare:composer-cache
  script:
    - vendor/bin/rector --dry-run || true
    - vendor/bin/rector --dry-run --output-format=gitlab > build/rector-codequality.json
  artifacts:
    reports:
      codequality: build/rector-codequality.json

qa:phpunit:
  extends:
    - .app-script
  needs:
    - job: prepare:composer-cache
  script:
    - vendor/bin/phpunit --colors=never --coverage-text --coverage-cobertura=build/phpunit-coverage.xml --log-junit build/phpunit-junit.xml  --do-not-cache-result
  artifacts:
    reports:
      junit: build/phpunit-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: build/phpunit-coverage.xml
  coverage: /^\s*Lines:\s*(\d+\.\d+)\%/

qa:behat:
  extends:
    - .app-script
  needs:
    - job: prepare:composer-cache
  services:
    - name: mysql:8.0-debian
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: "root"
    - name: redis:8-trixie
      command: ["redis-server", "--requirepass", "root"]
      alias: redis
  script:
    - phing -Dapp.env=test
    - vendor/bin/behat --format=junit --out=build/behat-junit --format=pretty --out=build/progress.txt --no-colors
    - cat build/progress.txt
  artifacts:
    reports:
      junit: build/behat-junit/*.xml

deploy-mainline:prepare-secrets:
    extends:
      - .app-script
    stage: deploy
    needs:
      - job: prepare-mainline:env
        artifacts: true
      - job: prepare:composer-cache
        artifacts: false
      - job: qa:php-cs-fixer
        artifacts: false
      - job: qa:phpstan
        artifacts: false
      - job: qa:rector
        artifacts: false
      - job: qa:phpunit
        artifacts: false
      - job: qa:behat
        artifacts: false
    script:
      - mkdir --parent build/secrets
      - composer symfony:dump-env prod
      - mv .env.local.php build/secrets
      - cp $JWT_PRIVATE_KEY build/secrets/jwt_private.pem
      - cp $JWT_PUBLIC_KEY build/secrets/jwt_public.pem
    artifacts:
      paths:
        - build/

deploy-mainline:secure-copy:
  extends:
    - .deploy-script-ssh
    - .job-policy-mainline
  stage: deploy
  needs:
    - job: build-mainline:docker-compose
      artifacts: true
    - job: deploy-mainline:prepare-secrets
      artifacts: true
  script:
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
      rm -rf '"$DEPLOY_DIRECTORY"'_tmp ;
      mkdir -p '"$DEPLOY_DIRECTORY"'_tmp'
    - scp -P 22 -r build/* ''"$DEPLOY_USER"'@'"$DEPLOY_HOST"':'"$DEPLOY_DIRECTORY"'_tmp'
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
      if [ -d '"$DEPLOY_DIRECTORY"' ]; then rm -rf '"$DEPLOY_DIRECTORY"'; fi ;
      mv '"$DEPLOY_DIRECTORY"'_tmp '"$DEPLOY_DIRECTORY"' ;
      cd '"$DEPLOY_DIRECTORY"' ;
      docker login -u gitlab-ci-token -p '"$CI_JOB_TOKEN"' '"$CI_REGISTRY"' ;
      docker compose pull ;
      docker compose up -d --no-recreate mysql redis ;
      docker compose up -d --force-recreate --no-deps spare ;
      docker compose exec -T spare phing database-deploy -Dapp.env=prod ;
      docker compose up -d --force-recreate --no-deps php ;
      echo "[$(date -R)] web-server is down" ;
      docker compose stop nginx ;
      docker compose up -d nginx ;
      docker logout '"$CI_REGISTRY"' ;
      echo "[$(date -R)] web-server is up"'

cleanup:docker-source-image:
  extends:
    - .job-policy-branches
  stage: .post
  except:
    *mainline
  variables:
    GIT_STRATEGY: none
    REGCTL_VERSION: v0.6.1
  script:
    - apk update && apk add curl
    - curl --fail-with-body --location "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
    - regctl registry login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - regctl tag rm $CI_SOURCE_IMAGE_WITH_TAG || true
    - docker rmi $CI_SOURCE_IMAGE_WITH_TAG || true
  allow_failure: true

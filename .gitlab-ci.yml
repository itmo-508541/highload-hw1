variables:
  CI_APP_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  CI_APP_IMAGE_CACHE: "$CI_REGISTRY_IMAGE:master"
  CI_DEV_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/dev:$CI_COMMIT_REF_NAME"
  CI_DEV_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/dev:master"
  CI_SOURCE_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/source:$CI_COMMIT_REF_NAME"
  CI_SOURCE_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/source:master"
  CI_NGINX_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_NAME"
  CI_NGINX_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/nginx:master"
  CI_DOCKER_COMPOSE_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/docker-compose:$CI_COMMIT_REF_NAME"
  CI_DOCKER_COMPOSE_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/docker-compose:master"
  CI_GIT_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/git:$CI_COMMIT_REF_NAME"
  CI_GIT_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/git:master"

stages:
  - prepare
  - build-step1
  - build-step2
  - test
  - deploy
  - data

.suffix-vars:
  before_script:
    - cat .env | grep ENV_ > .build-env
    - sed -i 's/^/export /' .build-env
    - for name in `env | awk -F= '{if($1 ~ /'"$ENV_SUFFIX"'$/) print $1}'`; do
        echo 'export '`echo $name|awk -F''"$ENV_SUFFIX"'$' '{print $1}'`'='`printenv $name`'' >> .build-env;
      done

.deploy-script:
  image: $CI_GIT_IMAGE_WITH_TAG
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
  tags:
    - executor-docker

.qa:
  stage: prepare
  image: jakzal/phpqa:1.9.2-alpine
  tags:
    - executor-docker

.docker-compose-image:
  stage: prepare
  image: docker:stable
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_DOCKER_COMPOSE_IMAGE_CACHE || true
    - docker build
      --cache-from $CI_DOCKER_COMPOSE_IMAGE_CACHE
      --tag $CI_DOCKER_COMPOSE_IMAGE_WITH_TAG
      ./docker/compose
    - docker push $CI_DOCKER_COMPOSE_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY
  tags:
    - executor-docker
    - docker-in-docker

.docker-git-image:
  stage: prepare
  image: docker:stable
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_GIT_IMAGE_CACHE || true
    - docker build
      --cache-from $CI_GIT_IMAGE_CACHE
      --tag $CI_GIT_IMAGE_WITH_TAG
      ./docker/git
    - docker push $CI_GIT_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY
  tags:
    - executor-docker
    - docker-in-docker

.docker-source-image:
  extends:
    - .suffix-vars
  stage: build-step1
  image: docker:stable
  script:
    - eval $(cat .build-env)
    - echo '{"github-oauth":{"github.com":"'"$COMPOSER_GITHUB_TOKEN"'"}}' > ./auth.json
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_DEV_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DEV_IMAGE_CACHE
          --tag $CI_DEV_IMAGE_WITH_TAG
          --target dev .
    - docker push $CI_DEV_IMAGE_WITH_TAG
    - docker pull $CI_SOURCE_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DEV_IMAGE_CACHE
          --cache-from $CI_SOURCE_IMAGE_CACHE
          --tag $CI_SOURCE_IMAGE_WITH_TAG
          --target source .
    - docker push $CI_SOURCE_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY
  tags:
    - executor-docker
    - docker-in-docker

.docker-app-image:
  extends:
    - .suffix-vars
  stage: build-step2
  image: docker:stable
  script:
    - eval $(cat .build-env)
    - echo '{"github-oauth":{"github.com":"'"$COMPOSER_GITHUB_TOKEN"'"}}' > ./auth.json
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_DEV_IMAGE_CACHE || true
    - docker pull $CI_SOURCE_IMAGE_CACHE || true
    - docker pull $CI_APP_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DEV_IMAGE_CACHE
          --cache-from $CI_SOURCE_IMAGE_CACHE
          --cache-from $CI_APP_IMAGE_CACHE
          --tag $CI_APP_IMAGE_WITH_TAG
          --build-arg source_image=$CI_SOURCE_IMAGE_WITH_TAG
          --target prod .
    - docker push $CI_APP_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY
  tags:
    - executor-docker
    - docker-in-docker

.docker-compose:
  extends:
    - .suffix-vars
  stage: build-step2
  image: $CI_DOCKER_COMPOSE_IMAGE_WITH_TAG
  script:
    - eval $(cat .build-env)
    - mkdir build
    - printenv | grep ENV_ > .compose-env
    - docker-compose -f docker-compose.deploy.yml config > build/docker-compose.yml
    - sed -i 's/\/builds\/'"$CI_PROJECT_NAMESPACE"'\/'"$CI_PROJECT_NAME"'/\./g' build/docker-compose.yml
  artifacts:
    untracked: true
    name: "$CI_COMMIT_REF_SLUG"
    paths:
      - build/
  tags:
    - executor-docker
  dependencies: []

.docker-nginx-image:
  extends:
    - .suffix-vars
  stage: build-step2
  image: docker:stable
  script:
    - eval $(cat .build-env)
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_NGINX_IMAGE_CACHE || true
    - docker pull $CI_SOURCE_IMAGE_WITH_TAG || true
    - docker build --build-arg server_name=$SERVER_NAME --build-arg server_upstream=prod --build-arg app_image=$CI_SOURCE_IMAGE_WITH_TAG
          --cache-from $CI_NGINX_IMAGE_CACHE
          --tag $CI_NGINX_IMAGE_WITH_TAG
          --target prod
          --file Dockerfile-nginx .
    - docker push $CI_NGINX_IMAGE_WITH_TAG
    - docker history --no-trunc $CI_NGINX_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY
  tags:
    - executor-docker
    - docker-in-docker

.phpunit:
  extends:
    - .suffix-vars
  stage: test
  image: $CI_SOURCE_IMAGE_WITH_TAG
  script:
    - eval $(cat .build-env)
    - cd /srv
    - composer install --prefer-dist --no-scripts --no-interaction
    - phpunit
  tags:
    - executor-docker
  dependencies: []

.secure-copy:
  extends:
    - .deploy-script
  stage: deploy
  script:
    - eval $(cat .build-env)
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
          rm -rf '"$DEPLOY_DIRECTORY"'_tmp ;
          mkdir -p '"$DEPLOY_DIRECTORY"'_tmp'
    - scp -P 22 -r build/* ''"$DEPLOY_USER"'@'"$DEPLOY_HOST"':'"$DEPLOY_DIRECTORY"'_tmp'
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
          if [ -d '"$DEPLOY_DIRECTORY"' ]; then rm -rf '"$DEPLOY_DIRECTORY"'; fi ;
          mv '"$DEPLOY_DIRECTORY"'_tmp '"$DEPLOY_DIRECTORY"' ;
          cd '"$DEPLOY_DIRECTORY"' ;
          docker login -u gitlab-ci-token -p '"$CI_JOB_TOKEN"' '"$CI_REGISTRY"' ;
          docker-compose pull ;
          docker-compose up -d --no-recreate ;
          docker-compose up -d --force-recreate --no-deps spare ;
          docker-compose exec -T spare phing storage-prepare database-deploy -Dsymfony.env=prod ;
          docker-compose up -d --force-recreate --no-deps php ;
          docker-compose exec -T php cron ;
          echo "[$(date -R)] web-server is down" ;
          docker-compose stop nginx ;
          docker-compose up -d nginx ;
          docker logout '"$CI_REGISTRY"' ;
          echo "[$(date -R)] web-server is up"'

.fixture:
  extends:
    - .deploy-script
  stage: data
  when: manual
  dependencies: []

.fixture-admin:
  extends:
    - .fixture
  script:
    - eval $(cat .build-env)
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
          cd '"$DEPLOY_DIRECTORY"' ;
          docker-compose exec php -T bin\console fos:user:create admin admin@docker.local admin ;
          docker-compose exec php -T bin\console fos:user:promote admin ROLE_SUPER_ADMIN'

.env-test:
  variables:
    ENV_SUFFIX: "_TEST"

.env-master:
  variables:
    ENV_SUFFIX: "_MASTER"

.env-production:
  variables:
    ENV_SUFFIX: "_PRODUCTION"

.job-policy-master:
  only:
    - master
  except:
    - tags

.job-policy-production:
  only:
    - /^release-.*$/
  except:
    - branches

qa:php-cs-fixer:
  extends:
    - .qa
  script:
    - php-cs-fixer fix --diff --dry-run -v

build:docker-compose-image-master:
  extends:
    - .env-master
    - .docker-compose-image
    - .job-policy-master

build:docker-git-image-master:
  extends:
    - .env-master
    - .docker-git-image
    - .job-policy-master

build:docker-source-image-master:
  extends:
    - .env-master
    - .docker-source-image
    - .job-policy-master

build:docker-app-image-master:
  extends:
    - .env-master
    - .docker-app-image
    - .job-policy-master

build:docker-compose-master:
  extends:
    - .env-master
    - .docker-compose
    - .job-policy-master

build:docker-nginx-image-master:
  extends:
    - .env-master
    - .docker-nginx-image
    - .job-policy-master

test:phpunit-master:
  extends:
    - .env-test
    - .phpunit
    - .job-policy-master

deploy:secure-copy-master:
  extends:
    - .secure-copy
    - .job-policy-master
  environment:
    name: staging
  dependencies:
    - build:docker-compose-master

data:fixture-cron-master:
  extends:
    - .env-master
    - .fixture-admin
    - .job-policy-master

build:docker-compose-image-production:
  extends:
    - .env-production
    - .docker-compose-image
    - .job-policy-production

build:docker-git-image-production:
  extends:
    - .env-production
    - .docker-git-image
    - .job-policy-production

build:docker-source-image-production:
  extends:
    - .env-production
    - .docker-source-image
    - .job-policy-production

build:docker-app-image-production:
  extends:
    - .env-production
    - .docker-app-image
    - .job-policy-production

build:docker-compose-production:
  extends:
    - .env-production
    - .docker-compose
    - .job-policy-production

build:docker-nginx-image-production:
  extends:
    - .env-production
    - .docker-nginx-image
    - .job-policy-production

test:phpunit-production:
  extends:
    - .env-test
    - .phpunit
    - .job-policy-production

deploy:secure-copy-production:
  extends:
    - .secure-copy
    - .job-policy-production
  environment:
    name: production
  dependencies:
    - build:docker-compose-production

data:fixture-cron-production:
  extends:
    - .env-production
    - .fixture-admin
    - .job-policy-production

deploy:sync-project-forks:
  stage: deploy
  image: $CI_GIT_IMAGE_WITH_TAG
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
  script:
    - git branch -d stable || true
    - git checkout -b stable
    - for FORK in $PROJECT_FORKS; do git remote add fork $FORK && git push fork stable && git remote rm fork; done
  only:
    - master
  dependencies: []
  tags:
    - executor-docker

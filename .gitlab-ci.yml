cleanup:docker-source-image:
  extends:
    - .job-policy-branches
  stage: .post
  except:
    *mainline
  variables:
    GIT_STRATEGY: none
    REGCTL_VERSION: v0.6.1
  script:
    - apk update && apk add curl
    - curl --fail-with-body --location "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
    - regctl registry login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - regctl tag rm $CI_SOURCE_IMAGE_WITH_TAG || true
    - docker rmi $CI_SOURCE_IMAGE_WITH_TAG || true
  allow_failure: true

cleanup:docker-source-image:
  extends:
    - .deploy-script
  stage: .post
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^production/
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
      when: never
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: never
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_STRATEGY: none
    REGCTL_VERSION: v0.6.1
  script:
    - apk update
    - apk add curl
    - curl --fail-with-body --location "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
    - regctl registry login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - regctl tag rm $CI_SOURCE_IMAGE_WITH_TAG
    - docker rmi $CI_SOURCE_IMAGE_WITH_TAG
  allow_failure: true

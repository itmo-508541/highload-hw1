deploy:sync-project-forks:
  extends:
    - .job-policy-master
  stage: deploy
  image: $CI_GIT_IMAGE_WITH_TAG
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
  script:
    - git branch -d stable || true
    - git checkout -b stable
    - for FORK in $PROJECT_FORKS; do git remote add fork $FORK && git push fork stable && git remote rm fork; done

data:fixture-admin:
  extends:
    - .fixture
    - .job-policy-all #-master
  script:
    - eval $(cat .build-env)
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
          cd '"$DEPLOY_DIRECTORY"' ;
          docker-compose exec -T php bin/console app:user:create admin admin ;
          docker-compose exec -T php bin/console app:user:promote admin ROLE_SUPER_ADMIN'

image: docker:19.03.13

variables:
  CI_APP_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  CI_APP_IMAGE_CACHE: "$CI_REGISTRY_IMAGE:master"
  CI_DEV_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/dev:$CI_COMMIT_REF_NAME"
  CI_DEV_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/dev:master"
  CI_SOURCE_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/source:$CI_COMMIT_REF_NAME"
  CI_SOURCE_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/source:master"
  CI_NGINX_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_NAME"
  CI_NGINX_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/nginx:master"
  CI_DOCKER_COMPOSE_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/docker-compose:$CI_COMMIT_REF_NAME"
  CI_DOCKER_COMPOSE_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/docker-compose:master"
  CI_GIT_IMAGE_WITH_TAG: "$CI_REGISTRY_IMAGE/git:$CI_COMMIT_REF_NAME"
  CI_GIT_IMAGE_CACHE: "$CI_REGISTRY_IMAGE/git:master"

stages:
  - .pre
  - pre-build
  - build
  - test
  - deploy
  - .post

.job-tags:
  tags:
    - executor-docker
    - docker-in-docker

.job-policy-master:
  extends:
    - .job-tags
  only:
    - master

.job-policy-production:
  extends:
    - .job-tags
  only:
    - production

.job-policy-all:
  extends:
    - .job-tags
  only:
    - master
    - production

.deploy-script:
  image: $CI_GIT_IMAGE_WITH_TAG
  variables:
    GIT_STRATEGY: none
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")

.fixture:
  extends:
    - .deploy-script
  stage: .post
  when: manual

qa:php-cs-fixer:
  extends:
    - .job-policy-all
  stage: .pre
  needs: []
  image: jakzal/phpqa:1.76-php8.0-alpine
  script:
    - php-cs-fixer fix --diff --dry-run -v

prepare:env:
  extends:
    - .job-policy-all
  stage: .pre
  needs: []
  before_script:
    - if [[ $CI_COMMIT_BRANCH == "production" ]]; then ENV_SUFFIX="_PRODUCTION"; else ENV_SUFFIX="_MASTER"; fi
  script: &prepare-env # весь script целиком используется как before_script в test:phpunit
    - cat .env | grep ENV_ > .build-env
    - sed -i 's/^/export /' .build-env
    - for name in `env | awk -F= '{if($1 ~ /'"$ENV_SUFFIX"'$/) print $1}'`; do
        echo 'export '`echo $name|awk -F''"$ENV_SUFFIX"'$' '{print $1}'`'='`printenv $name`'' >> .build-env;
      done
  artifacts:
    paths:
      - .build-env

build:docker-compose-image:
  extends:
    - .job-policy-all #-master
  stage: pre-build
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_DOCKER_COMPOSE_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DOCKER_COMPOSE_IMAGE_CACHE
          --tag $CI_DOCKER_COMPOSE_IMAGE_WITH_TAG
          ./docker/compose
    - docker push $CI_DOCKER_COMPOSE_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

build:docker-git-image:
  extends:
    - .job-policy-all
  stage: pre-build
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_GIT_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_GIT_IMAGE_CACHE
          --tag $CI_GIT_IMAGE_WITH_TAG
          ./docker/git
    - docker push $CI_GIT_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

build:docker-source-image:
  extends:
    - .job-policy-all #-master
  stage: pre-build
  needs:
    - job: prepare:env
      artifacts: true
  script:
    - eval $(cat .build-env)
    - echo '{"github-oauth":{"github.com":"'"$COMPOSER_GITHUB_TOKEN"'"}}' > ./auth.json
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_DEV_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DEV_IMAGE_CACHE
          --tag $CI_DEV_IMAGE_WITH_TAG
          --target dev .
    - docker push $CI_DEV_IMAGE_WITH_TAG
    - docker pull $CI_SOURCE_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DEV_IMAGE_CACHE
          --cache-from $CI_SOURCE_IMAGE_CACHE
          --tag $CI_SOURCE_IMAGE_WITH_TAG
          --target source .
    - docker push $CI_SOURCE_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

build:docker-app-image:
  extends:
    - .job-policy-all #-master
  stage: build
  needs:
    - job: build:docker-source-image
    - job: prepare:env
      artifacts: true
  script:
    - eval $(cat .build-env)
    - echo '{"github-oauth":{"github.com":"'"$COMPOSER_GITHUB_TOKEN"'"}}' > ./auth.json
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_DEV_IMAGE_CACHE || true
    - docker pull $CI_SOURCE_IMAGE_CACHE || true
    - docker pull $CI_APP_IMAGE_CACHE || true
    - docker build
          --cache-from $CI_DEV_IMAGE_CACHE
          --cache-from $CI_SOURCE_IMAGE_CACHE
          --cache-from $CI_APP_IMAGE_CACHE
          --tag $CI_APP_IMAGE_WITH_TAG
          --build-arg source_image=$CI_SOURCE_IMAGE_WITH_TAG
          --target prod .
    - docker push $CI_APP_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

build:docker-compose:
  extends:
    - .job-policy-all #-master
  stage: build
  needs:
    - job: build:docker-compose-image
    - job: prepare:env
      artifacts: true
  image: $CI_DOCKER_COMPOSE_IMAGE_WITH_TAG
  script:
    - eval $(cat .build-env)
    - mkdir build
    - for name in `env | awk -F= '{if($1 ~ /_MASTER|_TEST|_PRODUCTION$/) print $1}'`; do
        unset $name;
      done
    - printenv | grep ENV_ > .compose-env
    - docker-compose -f docker-compose.deploy.yml config > build/docker-compose.yml
    - sed -i 's/\/builds\/'"$CI_PROJECT_NAMESPACE"'\/'"$CI_PROJECT_NAME"'/\./g' build/docker-compose.yml
  artifacts:
    paths:
      - build/

build:docker-nginx-image:
  extends:
    - .job-policy-all #-master
  stage: build
  needs:
    - job: build:docker-source-image
    - job: prepare:env
      artifacts: true
  script:
    - eval $(cat .build-env)
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_NGINX_IMAGE_CACHE || true
    - docker pull $CI_SOURCE_IMAGE_WITH_TAG || true
    - docker build --build-arg server_name=$SERVER_NAME --build-arg server_upstream=prod --build-arg app_image=$CI_SOURCE_IMAGE_WITH_TAG
          --cache-from $CI_NGINX_IMAGE_CACHE
          --tag $CI_NGINX_IMAGE_WITH_TAG
          --target prod
          --file Dockerfile-nginx .
    - docker push $CI_NGINX_IMAGE_WITH_TAG
    - docker logout $CI_REGISTRY

test:phpunit:
  variables:
    ENV_SUFFIX: "_TEST"
  extends:
    - .job-policy-all #-master
  stage: test
  needs:
    - job: build:docker-source-image
  image: $CI_SOURCE_IMAGE_WITH_TAG
  before_script: *prepare-env
  script:
    - eval $(cat .build-env)
    - cd /srv
    - composer install --prefer-dist --no-scripts --no-interaction
    - phpunit
  dependencies: []

deploy:secure-copy:
  extends:
    - .deploy-script
    - .job-policy-all #-master
  stage: deploy
  script:
    - eval $(cat .build-env)
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
          rm -rf '"$DEPLOY_DIRECTORY"'_tmp ;
          mkdir -p '"$DEPLOY_DIRECTORY"'_tmp'
    - scp -P 22 -r build/* ''"$DEPLOY_USER"'@'"$DEPLOY_HOST"':'"$DEPLOY_DIRECTORY"'_tmp'
    - ssh -p 22 $DEPLOY_USER@$DEPLOY_HOST 'set -e ;
          if [ -d '"$DEPLOY_DIRECTORY"' ]; then rm -rf '"$DEPLOY_DIRECTORY"'; fi ;
          mv '"$DEPLOY_DIRECTORY"'_tmp '"$DEPLOY_DIRECTORY"' ;
          cd '"$DEPLOY_DIRECTORY"' ;
          docker login -u gitlab-ci-token -p '"$CI_JOB_TOKEN"' '"$CI_REGISTRY"' ;
          docker-compose pull ;
          docker-compose up -d --no-recreate mysql ;
          docker-compose up -d --force-recreate --no-deps spare ;
          docker-compose exec -T spare phing storage-prepare database-deploy -Dsymfony.env=prod ;
          docker-compose up -d --force-recreate --no-deps php ;
          echo "[$(date -R)] web-server is down" ;
          docker-compose stop nginx ;
          docker-compose up -d nginx ;
          docker logout '"$CI_REGISTRY"' ;
          echo "[$(date -R)] web-server is up"'

